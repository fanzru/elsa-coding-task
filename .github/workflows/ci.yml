name: CI

# Pull requests: lint + typecheck + test + build. Pushes to main: test + build only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz_test
        options: >-
          --health-cmd "pg_isready -U quiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        if: github.event_name != 'push'
      - run: pnpm typecheck
        if: github.event_name != 'push'
      - run: pnpm test
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgres://quiz:quiz@127.0.0.1:5432/quiz_test
      - run: pnpm build
